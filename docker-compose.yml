services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py import_products && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
